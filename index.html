const weekdays=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];let anchor=new Date(2026,8,31);let weekShift=0,filter='all';const fmt=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'});const dateFmt=new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit'});function monday(d){let x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x}anchor=monday(new Date());
